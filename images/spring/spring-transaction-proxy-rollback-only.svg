<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">트랜잭션 프록시와 rollback-only 예외 흐름</title>
  <desc id="desc">프록시가 트랜잭션을 시작하고 메소드가 update 예외를 잡아 반환하지만, 프록시의 commit 단계에서 rollback-only를 발견해 UnexpectedRollbackException을 던지는 순서</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .label{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .proxy{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .method{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
      .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .error{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
      .line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <rect class="proxy" x="45" y="55" width="190" height="90" rx="12"/>
  <text class="label" x="140" y="91" text-anchor="middle">프록시</text>
  <text class="small" x="140" y="119" text-anchor="middle">트랜잭션 시작</text>
  <path class="line" d="M235 100 H285"/>
  <rect class="method" x="285" y="55" width="190" height="90" rx="12"/>
  <text class="label" x="380" y="91" text-anchor="middle">메소드 본문</text>
  <text class="small" x="380" y="119" text-anchor="middle">UPDATE 실행</text>
  <path class="line" d="M475 100 H525"/>
  <rect class="warn" x="525" y="55" width="190" height="90" rx="12"/>
  <text class="label" x="620" y="88" text-anchor="middle">UPDATE 예외</text>
  <text class="small" x="620" y="116" text-anchor="middle">rollback-only 마킹</text>
  <path class="line" d="M715 100 H765"/>
  <rect class="method" x="765" y="55" width="150" height="90" rx="12"/>
  <text class="label" x="840" y="88" text-anchor="middle">catch</text>
  <text class="small" x="840" y="116" text-anchor="middle">정상 반환</text>
  <path class="line" d="M840 145 V225 H715"/>
  <rect class="proxy" x="525" y="225" width="190" height="90" rx="12"/>
  <text class="label" x="620" y="261" text-anchor="middle">프록시</text>
  <text class="small" x="620" y="289" text-anchor="middle">commit() 시도</text>
  <path class="line" d="M525 270 H475"/>
  <rect class="warn" x="285" y="225" width="190" height="90" rx="12"/>
  <text class="label" x="380" y="258" text-anchor="middle">rollback-only 발견</text>
  <text class="small" x="380" y="286" text-anchor="middle">커밋 불가</text>
  <path class="line" d="M380 315 V365"/>
  <rect class="error" x="245" y="365" width="270" height="90" rx="12"/>
  <text class="label" x="380" y="402" text-anchor="middle">UnexpectedRollbackException</text>
  <text class="small" x="380" y="430" text-anchor="middle">메소드 try-catch 바깥에서 발생</text>
</svg>
