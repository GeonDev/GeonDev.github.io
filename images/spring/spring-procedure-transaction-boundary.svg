<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Spring 트랜잭션과 프로시저 실행 경계</title>
  <desc id="desc">Spring 트랜잭션 안에서 프로시저와 서비스 DB 작업을 순서대로 실행하고, 두 작업의 성공 여부에 따라 커밋하거나 롤백하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
      .tx{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .ok{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .fail{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
      .line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <rect class="tx" x="35" y="35" width="890" height="360" rx="18"/>
  <text class="label" x="65" y="72">Spring 트랜잭션 경계</text>
  <rect class="box" x="70" y="125" width="220" height="90" rx="12"/>
  <text class="label" x="180" y="162" text-anchor="middle">프로시저 실행</text>
  <text class="small" x="180" y="190" text-anchor="middle">COMMIT 없음</text>
  <path class="line" d="M290 170 H365"/>
  <rect class="box" x="365" y="125" width="230" height="90" rx="12"/>
  <text class="label" x="480" y="162" text-anchor="middle">서비스 DB 작업</text>
  <text class="small" x="480" y="190" text-anchor="middle">같은 Connection 사용</text>
  <path class="line" d="M595 170 H670"/>
  <rect class="box" x="670" y="125" width="220" height="90" rx="12"/>
  <text class="label" x="780" y="162" text-anchor="middle">Spring 결과 판정</text>
  <text class="small" x="780" y="190" text-anchor="middle">두 작업의 성공 여부</text>
  <path class="line" d="M780 215 V268 H660"/>
  <path class="line" d="M780 215 V268 H845"/>
  <rect class="ok" x="540" y="268" width="190" height="78" rx="12"/>
  <text class="label" x="635" y="301" text-anchor="middle">둘 다 성공</text>
  <text class="small" x="635" y="327" text-anchor="middle">COMMIT</text>
  <rect class="fail" x="750" y="268" width="140" height="78" rx="12"/>
  <text class="label" x="820" y="301" text-anchor="middle">하나 실패</text>
  <text class="small" x="820" y="327" text-anchor="middle">ROLLBACK</text>
</svg>
